<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading — Villa Construction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0b0e1a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .container {
    position: relative;
    width: 700px;
    height: 560px;
  }

  svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 40px rgba(100, 180, 255, 0.06));
  }

  .progress-wrapper {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 360px;
    text-align: center;
  }

  .progress-bar-bg {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f6d365, #fda085, #f093fb);
    border-radius: 4px;
    transition: width 0.3s ease;
    box-shadow: 0 0 16px rgba(253, 160, 133, 0.4);
  }

  .progress-percent {
    color: #fff;
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .progress-label {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .status-text {
    color: rgba(255,255,255,0.25);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.05; }
    50% { opacity: var(--max-o); }
  }

  .container { z-index: 1; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <svg viewBox="0 0 700 560" id="villaSvg">
    <defs>
      <!-- Gradients -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0b0e1a" stop-opacity="0"/>
        <stop offset="100%" stop-color="#12142a" stop-opacity="1"/>
      </linearGradient>

      <linearGradient id="wallGrad1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f5f0e8"/>
        <stop offset="100%" stop-color="#e8e0d0"/>
      </linearGradient>

      <linearGradient id="wallGrad2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#e8e0d0"/>
        <stop offset="100%" stop-color="#ddd4c2"/>
      </linearGradient>

      <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5a4a3a"/>
        <stop offset="100%" stop-color="#3a2a1a"/>
      </linearGradient>

      <linearGradient id="tileRoofGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c47040"/>
        <stop offset="100%" stop-color="#a85830"/>
      </linearGradient>

      <linearGradient id="garageGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d4c8b4"/>
        <stop offset="100%" stop-color="#c4b8a2"/>
      </linearGradient>

      <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe4a0"/>
        <stop offset="100%" stop-color="#ffd070"/>
      </linearGradient>

      <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4a90c4"/>
        <stop offset="100%" stop-color="#2a6094"/>
      </linearGradient>

      <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a09880"/>
        <stop offset="100%" stop-color="#807860"/>
      </linearGradient>

      <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6b4c30"/>
        <stop offset="100%" stop-color="#4a3420"/>
      </linearGradient>

      <linearGradient id="fountainGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9090a0"/>
        <stop offset="100%" stop-color="#707080"/>
      </linearGradient>

      <filter id="warmGlow">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="softGlow">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="waterShimmer">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
      </filter>

      <clipPath id="mainClip">
        <rect x="160" y="160" width="340" height="240" />
      </clipPath>

      <!-- Window pattern -->
      <pattern id="windowGrid" width="30" height="35" patternUnits="userSpaceOnUse">
        <rect width="30" height="35" fill="url(#windowGlow)" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Ground -->
    <rect id="ground" x="0" y="420" width="700" height="140" fill="#1a3a14" opacity="0"/>
    <rect id="lawn" x="0" y="425" width="700" height="135" fill="#2a5a22" opacity="0"/>

    <!-- Swimming pool -->
    <g id="pool" opacity="0">
      <ellipse cx="580" cy="465" rx="70" ry="30" fill="url(#waterGrad)" filter="url(#waterShimmer)"/>
      <ellipse cx="580" cy="465" rx="70" ry="30" fill="none" stroke="#5a9ad4" stroke-width="1.5" opacity="0.5"/>
      <ellipse cx="580" cy="465" rx="66" ry="27" fill="none" stroke="#6aaae4" stroke-width="0.5" opacity="0.3"/>
      <!-- Pool reflection -->
      <ellipse cx="580" cy="460" rx="40" ry="8" fill="rgba(255,255,255,0.08)"/>
    </g>

    <!-- Fence -->
    <g id="fence" opacity="0">
      <line x1="20" y1="420" x2="130" y2="420" stroke="#807060" stroke-width="2"/>
      <line x1="500" y1="420" x2="680" y2="420" stroke="#807060" stroke-width="2"/>
      <!-- Fence posts -->
      <rect x="30" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="55" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="80" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="105" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="510" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="540" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="570" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="600" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="630" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
      <rect x="660" y="405" width="3" height="20" fill="#706050" rx="0.5"/>
    </g>

    <!-- Foundation -->
    <rect id="foundation" x="140" y="410" width="420" height="16" rx="3" fill="#707080" opacity="0"/>

    <!-- Main villa walls (2 floors) -->
    <g id="mainWalls" opacity="0">
      <!-- Main body -->
      <rect x="160" y="160" width="340" height="250" fill="url(#wallGrad1)" rx="3"/>
      <!-- Floor divider -->
      <rect x="160" y="280" width="340" height="4" fill="#c8bca4"/>
      <!-- Stone base accent -->
      <rect x="160" y="380" width="340" height="30" fill="url(#stoneGrad)" rx="0"/>
      <!-- Side wing (right - garage connection) -->
      <rect x="500" y="260" width="120" height="150" fill="url(#wallGrad2)" rx="3"/>
      <rect x="500" y="260" width="120" height="4" fill="#c8bca4"/>
      <rect x="500" y="380" width="120" height="30" fill="url(#stoneGrad)" rx="0"/>
    </g>

    <!-- Windows - First floor -->
    <g id="windows1F" opacity="0">
      <!-- Large bay window left -->
      <rect x="185" y="320" width="70" height="55" rx="3" fill="url(#windowGlow)" filter="url(#softGlow)"/>
      <rect x="185" y="320" width="70" height="55" rx="3" fill="none" stroke="#c8bca4" stroke-width="1.5"/>
      <line x1="220" y1="320" x2="220" y2="375" stroke="#c8bca4" stroke-width="1"/>
      <line x1="185" y1="348" x2="255" y2="348" stroke="#c8bca4" stroke-width="1"/>

      <!-- Center French doors -->
      <rect x="290" y="310" width="80" height="80" rx="3" fill="url(#windowGlow)" filter="url(#softGlow)"/>
      <rect x="290" y="310" width="80" height="80" rx="3" fill="none" stroke="#c8bca4" stroke-width="1.5"/>
      <line x1="330" y1="310" x2="330" y2="390" stroke="#c8bca4" stroke-width="1.5"/>
      <line x1="290" y1="350" x2="370" y2="350" stroke="#c8bca4" stroke-width="1"/>
      <!-- Door handles -->
      <circle cx="325" cy="352" r="2" fill="#a09070"/>
      <circle cx="335" cy="352" r="2" fill="#a09070"/>

      <!-- Right window -->
      <rect x="405" y="320" width="60" height="55" rx="3" fill="url(#windowGlow)" filter="url(#softGlow)"/>
      <rect x="405" y="320" width="60" height="55" rx="3" fill="none" stroke="#c8bca4" stroke-width="1.5"/>
      <line x1="435" y1="320" x2="435" y2="375" stroke="#c8bca4" stroke-width="1"/>
    </g>

    <!-- Windows - Second floor -->
    <g id="windows2F" opacity="0">
      <!-- Left window -->
      <rect x="190" y="185" width="60" height="55" rx="3" fill="url(#windowGlow)" filter="url(#softGlow)"/>
      <rect x="190" y="185" width="60" height="55" rx="3" fill="none" stroke="#c8bca4" stroke-width="1.5"/>
      <line x1="220" y1="185" x2="220" y2="240" stroke="#c8bca4" stroke-width="1"/>
      <line x1="190" y1="213" x2="250" y2="213" stroke="#c8bca4" stroke-width="1"/>

      <!-- Center balcony window -->
      <rect x="295" y="185" width="70" height="55" rx="3" fill="url(#windowGlow)" filter="url(#softGlow)"/>
      <rect x="295" y="185" width="70" height="55" rx="3" fill="none" stroke="#c8bca4" stroke-width="1.5"/>
      <line x1="330" y1="185" x2="330" y2="240" stroke="#c8bca4" stroke-width="1"/>
      <line x1="295" y1="213" x2="365" y2="213" stroke="#c8bca4" stroke-width="1"/>

      <!-- Right window -->
      <rect x="400" y="185" width="60" height="55" rx="3" fill="url(#windowGlow)" filter="url(#softGlow)"/>
      <rect x="400" y="185" width="60" height="55" rx="3" fill="none" stroke="#c8bca4" stroke-width="1.5"/>
      <line x1="430" y1="185" x2="430" y2="240" stroke="#c8bca4" stroke-width="1"/>

      <!-- Garage area window -->
      <rect x="530" y="285" width="40" height="45" rx="3" fill="url(#windowGlow)" filter="url(#softGlow)" opacity="0.7"/>
      <rect x="530" y="285" width="40" height="45" rx="3" fill="none" stroke="#c8bca4" stroke-width="1.5"/>
    </g>

    <!-- Balcony -->
    <g id="balcony" opacity="0">
      <!-- Balcony floor -->
      <rect x="285" y="252" width="90" height="6" fill="#a09070" rx="1"/>
      <!-- Railing -->
      <rect x="285" y="240" width="90" height="12" fill="none" stroke="#a09070" stroke-width="1.5"/>
      <!-- Vertical bars -->
      <line x1="295" y1="240" x2="295" y2="252" stroke="#a09070" stroke-width="1"/>
      <line x1="307" y1="240" x2="307" y2="252" stroke="#a09070" stroke-width="1"/>
      <line x1="319" y1="240" x2="319" y2="252" stroke="#a09070" stroke-width="1"/>
      <line x1="330" y1="240" x2="330" y2="252" stroke="#a09070" stroke-width="1"/>
      <line x1="342" y1="240" x2="342" y2="252" stroke="#a09070" stroke-width="1"/>
      <line x1="354" y1="240" x2="354" y2="252" stroke="#a09070" stroke-width="1"/>
      <line x1="365" y1="240" x2="365" y2="252" stroke="#a09070" stroke-width="1"/>
    </g>

    <!-- Roof - Main -->
    <g id="mainRoof" opacity="0">
      <!-- Main terracotta roof -->
      <polygon points="140,165 330,60 520,165" fill="url(#tileRoofGrad)"/>
      <polygon points="150,165 330,70 510,165" fill="none" stroke="#b86840" stroke-width="0.8" opacity="0.5"/>
      <!-- Roof tile lines -->
      <line x1="165" y1="150" x2="495" y2="150" stroke="#985030" stroke-width="0.8" opacity="0.5"/>
      <line x1="185" y1="132" x2="475" y2="132" stroke="#985030" stroke-width="0.8" opacity="0.5"/>
      <line x1="205" y1="115" x2="455" y2="115" stroke="#985030" stroke-width="0.8" opacity="0.5"/>
      <line x1="230" y1="96" x2="430" y2="96" stroke="#985030" stroke-width="0.8" opacity="0.5"/>
      <line x1="260" y1="78" x2="400" y2="78" stroke="#985030" stroke-width="0.8" opacity="0.5"/>

      <!-- Roof edge trim -->
      <rect x="135" y="162" width="390" height="6" fill="#8a5a3a" rx="1"/>
    </g>

    <!-- Roof - Garage side -->
    <g id="garageRoof" opacity="0">
      <polygon points="490,265 560,210 630,265" fill="url(#tileRoofGrad)"/>
      <rect x="485" y="262" width="150" height="6" fill="#8a5a3a" rx="1"/>
      <!-- Tile lines -->
      <line x1="505" y1="250" x2="615" y2="250" stroke="#985030" stroke-width="0.8" opacity="0.5"/>
      <line x1="520" y1="236" x2="600" y2="236" stroke="#985030" stroke-width="0.8" opacity="0.5"/>
      <line x1="538" y1="222" x2="582" y2="222" stroke="#985030" stroke-width="0.8" opacity="0.5"/>
    </g>

    <!-- Chimneys -->
    <g id="chimneys" opacity="0">
      <rect x="250" y="70" width="24" height="55" fill="url(#stoneGrad)" rx="2"/>
      <rect x="246" y="66" width="32" height="10" fill="#908870" rx="2"/>
      <rect x="430" y="80" width="20" height="50" fill="url(#stoneGrad)" rx="2"/>
      <rect x="426" y="76" width="28" height="10" fill="#908870" rx="2"/>
    </g>

    <!-- Garage door -->
    <g id="garageDoor" opacity="0">
      <rect x="515" y="310" width="90" height="80" rx="3" fill="#6a7a8a"/>
      <rect x="515" y="310" width="90" height="80" rx="3" fill="none" stroke="#5a6a7a" stroke-width="1.5"/>
      <!-- Garage door panels -->
      <line x1="515" y1="330" x2="605" y2="330" stroke="#5a6a7a" stroke-width="0.8"/>
      <line x1="515" y1="350" x2="605" y2="350" stroke="#5a6a7a" stroke-width="0.8"/>
      <line x1="515" y1="370" x2="605" y2="370" stroke="#5a6a7a" stroke-width="0.8"/>
    </g>

    <!-- Front entrance -->
    <g id="entrance" opacity="0">
      <!-- Porch -->
      <rect x="270" y="385" width="120" height="12" fill="#a09070" rx="1"/>
      <!-- Columns -->
      <rect x="275" y="320" width="8" height="65" fill="#e8e0d0"/>
      <rect x="377" y="320" width="8" height="65" fill="#e8e0d0"/>
      <!-- Column caps -->
      <rect x="272" y="318" width="14" height="6" fill="#d4c8b4" rx="1"/>
      <rect x="374" y="318" width="14" height="6" fill="#d4c8b4" rx="1"/>
      <!-- Front door -->
      <rect x="305" y="335" width="50" height="50" rx="3" fill="url(#woodGrad)"/>
      <rect x="305" y="335" width="50" height="50" rx="3" fill="none" stroke="#8a6a4a" stroke-width="1.5"/>
      <!-- Door window -->
      <rect x="315" y="340" width="30" height="18" rx="2" fill="url(#windowGlow)" opacity="0.8"/>
      <circle cx="347" cy="365" r="3" fill="#c8a050"/>
      <!-- Porch light -->
      <circle cx="330" cy="330" r="4" fill="#ffe4a0" filter="url(#warmGlow)"/>
    </g>

    <!-- Decorative columns on main facade -->
    <g id="columns" opacity="0">
      <rect x="155" y="160" width="10" height="250" fill="#e8e0d0" opacity="0.5"/>
      <rect x="495" y="160" width="10" height="250" fill="#e8e0d0" opacity="0.5"/>
    </g>

    <!-- Driveway -->
    <g id="driveway" opacity="0">
      <polygon points="530,390 500,440 650,440 630,390" fill="#5a5a6a" opacity="0.6"/>
      <polygon points="530,390 500,440 650,440 630,390" fill="none" stroke="#6a6a7a" stroke-width="0.5"/>
    </g>

    <!-- Front path -->
    <g id="frontPath" opacity="0">
      <polygon points="310,397 290,440 370,440 350,397" fill="#b8a890" opacity="0.5"/>
      <!-- Stone pavers -->
      <rect x="310" y="400" width="40" height="6" fill="#c8b8a0" rx="1" opacity="0.4"/>
      <rect x="308" y="410" width="44" height="6" fill="#c8b8a0" rx="1" opacity="0.4"/>
      <rect x="305" y="420" width="50" height="6" fill="#c8b8a0" rx="1" opacity="0.4"/>
    </g>

    <!-- Fountain -->
    <g id="fountain" opacity="0">
      <!-- Base -->
      <ellipse cx="95" cy="445" rx="30" ry="12" fill="url(#fountainGrad)"/>
      <ellipse cx="95" cy="443" rx="28" ry="10" fill="url(#waterGrad)" opacity="0.7"/>
      <!-- Pillar -->
      <rect x="91" y="420" width="8" height="25" fill="url(#fountainGrad)"/>
      <!-- Top bowl -->
      <ellipse cx="95" cy="418" rx="15" ry="6" fill="url(#fountainGrad)"/>
      <ellipse cx="95" cy="416" rx="13" ry="5" fill="url(#waterGrad)" opacity="0.7"/>
    </g>

    <!-- Trees -->
    <g id="trees" opacity="0">
      <!-- Left large tree -->
      <rect x="45" y="340" width="10" height="80" fill="#5a3e28" rx="3"/>
      <ellipse cx="50" cy="320" rx="38" ry="42" fill="#1a5a14"/>
      <ellipse cx="50" cy="310" rx="30" ry="32" fill="#2a7a24" opacity="0.6"/>
      <ellipse cx="40" cy="300" rx="20" ry="22" fill="#3a8a34" opacity="0.4"/>

      <!-- Right palm-like tree -->
      <rect x="650" y="370" width="6" height="50" fill="#5a4a30"/>
      <path d="M653,370 Q630,340 640,330" fill="none" stroke="#2a8a24" stroke-width="3"/>
      <path d="M653,370 Q660,330 670,325" fill="none" stroke="#2a8a24" stroke-width="3"/>
      <path d="M653,370 Q650,320 655,310" fill="none" stroke="#2a8a24" stroke-width="3"/>
      <path d="M653,370 Q675,345 680,340" fill="none" stroke="#3a9a34" stroke-width="2"/>
      <path d="M653,370 Q635,350 630,345" fill="none" stroke="#3a9a34" stroke-width="2"/>
    </g>

    <!-- Bushes / Hedges -->
    <g id="bushes" opacity="0">
      <!-- Along foundation -->
      <ellipse cx="200" cy="410" rx="18" ry="12" fill="#2a7a24"/>
      <ellipse cx="235" cy="412" rx="14" ry="10" fill="#1a6a14"/>
      <ellipse cx="440" cy="410" rx="18" ry="12" fill="#2a7a24"/>
      <ellipse cx="475" cy="412" rx="14" ry="10" fill="#1a6a14"/>
      <!-- Garden bushes -->
      <ellipse cx="130" cy="440" rx="22" ry="14" fill="#2a7a24"/>
      <ellipse cx="150" cy="445" rx="16" ry="11" fill="#1a6a14"/>
      <!-- Flower bushes -->
      <ellipse cx="45" cy="435" rx="12" ry="10" fill="#3a9a34"/>
      <circle cx="42" cy="430" r="3" fill="#ff6b8a" opacity="0.7"/>
      <circle cx="50" cy="428" r="2.5" fill="#ff8aaa" opacity="0.7"/>
      <circle cx="47" cy="435" r="2" fill="#ffb0c0" opacity="0.7"/>
    </g>

    <!-- Garden flowers -->
    <g id="flowers" opacity="0">
      <circle cx="175" cy="440" r="3" fill="#ff7070" opacity="0.7"/>
      <circle cx="185" cy="438" r="2.5" fill="#ff9090" opacity="0.7"/>
      <circle cx="180" cy="445" r="2" fill="#ff5050" opacity="0.7"/>
      <circle cx="500" cy="442" r="3" fill="#a070ff" opacity="0.7"/>
      <circle cx="510" cy="440" r="2.5" fill="#b090ff" opacity="0.7"/>
      <circle cx="505" cy="446" r="2" fill="#9060ff" opacity="0.7"/>
      <!-- Yellow flowers near entrance -->
      <circle cx="270" cy="438" r="2.5" fill="#ffd040" opacity="0.6"/>
      <circle cx="278" cy="435" r="2" fill="#ffe060" opacity="0.6"/>
      <circle cx="390" cy="438" r="2.5" fill="#ffd040" opacity="0.6"/>
      <circle cx="398" cy="435" r="2" fill="#ffe060" opacity="0.6"/>
    </g>

    <!-- Outdoor lighting (warm glow spots) -->
    <g id="outdoorLights" opacity="0">
      <circle cx="280" cy="400" r="20" fill="#ffe4a0" opacity="0.06" filter="url(#warmGlow)"/>
      <circle cx="380" cy="400" r="20" fill="#ffe4a0" opacity="0.06" filter="url(#warmGlow)"/>
      <!-- Path lights -->
      <circle cx="310" cy="420" r="3" fill="#ffe4a0" opacity="0.3" filter="url(#softGlow)"/>
      <circle cx="350" cy="420" r="3" fill="#ffe4a0" opacity="0.3" filter="url(#softGlow)"/>
    </g>

    <!-- Smoke from chimneys -->
    <g id="smoke" opacity="0"></g>

    <!-- Construction crane (fades out) -->
    <g id="crane" opacity="0">
      <rect x="480" y="60" width="6" height="360" fill="#e6a817"/>
      <rect x="450" y="55" width="100" height="8" fill="#e6a817" rx="2"/>
      <line x1="483" y1="63" x2="450" y2="180" stroke="#e6a817" stroke-width="1"/>
      <line x1="483" y1="63" x2="550" y2="160" stroke="#e6a817" stroke-width="1"/>
      <rect x="442" y="180" width="16" height="12" fill="#c9900a" rx="1"/>
      <line x1="450" y1="192" x2="450" y2="260" stroke="#c9900a" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Final warm glow overlay -->
    <g id="finalGlow" opacity="0">
      <rect x="160" y="160" width="340" height="250" fill="#ffe4a0" opacity="0.03"/>
    </g>

  </svg>

  <div class="progress-wrapper">
    <div class="progress-percent" id="percentText">0%</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">Загрузка</div>
    <div class="status-text" id="statusText">Подготовка фундамента</div>
  </div>
</div>

<script>
// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 100; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
  star.style.setProperty('--max-o', (0.3 + Math.random() * 0.6));
  star.style.animationDelay = Math.random() * 4 + 's';
  starsEl.appendChild(star);
}

const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

const els = {
  ground: $('ground'),
  lawn: $('lawn'),
  foundation: $('foundation'),
  mainWalls: $('mainWalls'),
  windows1F: $('windows1F'),
  windows2F: $('windows2F'),
  balcony: $('balcony'),
  mainRoof: $('mainRoof'),
  garageRoof: $('garageRoof'),
  chimneys: $('chimneys'),
  garageDoor: $('garageDoor'),
  entrance: $('entrance'),
  columns: $('columns'),
  driveway: $('driveway'),
  frontPath: $('frontPath'),
  fountain: $('fountain'),
  trees: $('trees'),
  bushes: $('bushes'),
  flowers: $('flowers'),
  outdoorLights: $('outdoorLights'),
  smoke: $('smoke'),
  crane: $('crane'),
  pool: $('pool'),
  fence: $('fence'),
  finalGlow: $('finalGlow'),
  progressFill: $('progressFill'),
  percentText: $('percentText'),
  progressLabel: $('progressLabel'),
  statusText: $('statusText'),
};

let progress = 0;
let currentStep = 0;
let smokeParticles = [];

const steps = [
  { from: 0,  to: 8,   label: 'Фундамент',       status: 'Устройство фундамента',              fn: buildFoundation },
  { from: 8,  to: 22,  label: 'Стены',             status: 'Возведение несущих стен',            fn: buildWalls },
  { from: 22, to: 38,  label: 'Кровля',            status: 'Монтаж черепичной кровли',           fn: buildRoof },
  { from: 38, to: 52,  label: 'Окна',              status: 'Установка оконных конструкций',      fn: buildWindows },
  { from: 52, to: 64,  label: 'Вход и балкон',     status: 'Оформление входа и балкона',         fn: buildEntrance },
  { from: 64, to: 76,  label: 'Гараж',             status: 'Отделка гаражной секции',            fn: buildGarage },
  { from: 76, to: 86,  label: 'Благоустройство',   status: 'Ландшафтный дизайн',                 fn: buildLandscaping },
  { from: 86, to: 96,  label: 'Освещение',         status: 'Монтаж наружного освещения',         fn: buildLighting },
  { from: 96, to: 100, label: 'Завершение',        status: 'Вилла готова!',                      fn: buildFinal },
];

function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function clamp(v) { return Math.max(0, Math.min(1, v)); }
function stepT(step) { return clamp((progress - step.from) / (step.to - step.from)); }

function buildFoundation(t) {
  t = easeOut(t);
  els.foundation.setAttribute('opacity', t);
  els.ground.setAttribute('opacity', t);
  els.lawn.setAttribute('opacity', t * 0.5);
  els.crane.setAttribute('opacity', t * 0.6);
}

function buildWalls(t) {
  t = easeOut(t);
  els.mainWalls.setAttribute('opacity', t);
  els.columns.setAttribute('opacity', t * 0.6);
  els.crane.setAttribute('opacity', t < 0.5 ? 0.6 : 0.6 * (1 - (t - 0.5) * 2));
}

function buildRoof(t) {
  t = easeOut(t);
  els.mainRoof.setAttribute('opacity', t);
  els.garageRoof.setAttribute('opacity', t);
  els.chimneys.setAttribute('opacity', t);
  els.crane.setAttribute('opacity', Math.max(0, 0.3 * (1 - t)));
}

function buildWindows(t) {
  t = easeOut(t);
  els.windows1F.setAttribute('opacity', t);
  els.windows2F.setAttribute('opacity', t);
}

function buildEntrance(t) {
  t = easeOut(t);
  els.balcony.setAttribute('opacity', t);
  els.entrance.setAttribute('opacity', t);
  els.frontPath.setAttribute('opacity', t * 0.5);
}

function buildGarage(t) {
  t = easeOut(t);
  els.garageDoor.setAttribute('opacity', t);
  els.driveway.setAttribute('opacity', t);
}

function buildLandscaping(t) {
  t = easeOut(t);
  els.trees.setAttribute('opacity', t);
  els.bushes.setAttribute('opacity', t);
  els.flowers.setAttribute('opacity', t);
  els.fountain.setAttribute('opacity', t);
  els.pool.setAttribute('opacity', t);
  els.fence.setAttribute('opacity', t);
}

function buildLighting(t) {
  t = easeOut(t);
  els.outdoorLights.setAttribute('opacity', t);
  createSmoke(t);
}

let finalTime = 0;
function buildFinal(t) {
  finalTime += 16;
  els.crane.setAttribute('opacity', 0);
  els.outdoorLights.setAttribute('opacity', 1);
  els.smoke.setAttribute('opacity', 1);

  // Pulsing window glow
  const pulse = 0.15 + 0.05 * Math.sin(finalTime / 600);
  const windows = document.querySelectorAll('[filter*="softGlow"]');
  windows.forEach(w => {
    if (w.getAttribute('fill') && w.getAttribute('fill').includes('ffe4a0')) {
      w.setAttribute('opacity', clamp(0.7 + 0.1 * Math.sin(finalTime / 400)));
    }
  });

  // Pool shimmer
  const pool = els.pool.querySelector('ellipse');
  if (pool) {
    pool.setAttribute('opacity', 0.6 + 0.1 * Math.sin(finalTime / 300));
  }
}

function createSmoke(t) {
  if (Math.random() < 0.06 && t > 0.3) {
    const circle = document.createElementNS(NS, 'circle');
    const chimneys = [262, 440];
    const cx = chimneys[Math.floor(Math.random() * 2)] + (Math.random() - 0.5) * 4;
    const cy = 60 + Math.random() * 10;
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', cy);
    circle.setAttribute('r', 4 + Math.random() * 5);
    circle.setAttribute('fill', 'rgba(180,180,190,0.25)');
    els.smoke.appendChild(circle);
    smokeParticles.push({ el: circle, x: cx, y: cy, age: 0, maxAge: 70 + Math.random() * 50 });
  }

  smokeParticles = smokeParticles.filter(p => {
    p.age++;
    const life = p.age / p.maxAge;
    p.el.setAttribute('cy', p.y - life * 80);
    p.el.setAttribute('cx', p.x + Math.sin(p.age * 0.08) * 12);
    p.el.setAttribute('opacity', (1 - life) * 0.35);
    p.el.setAttribute('r', parseFloat(p.el.getAttribute('r')) + 0.04);
    if (p.age >= p.maxAge) { p.el.remove(); return false; }
    return true;
  });
}

function updateUI() {
  const pct = Math.round(progress);
  els.percentText.textContent = pct + '%';
  els.progressFill.style.width = pct + '%';
  const step = steps[currentStep] || steps[steps.length - 1];
  els.progressLabel.textContent = step.label;
  els.statusText.textContent = step.status;
}

function animate() {
  if (progress < 100) {
    progress += 0.12 + Math.random() * 0.08;
    if (progress > 100) progress = 100;
  }

  for (let i = steps.length - 1; i >= 0; i--) {
    if (progress >= steps[i].from) { currentStep = i; break; }
  }

  for (let i = 0; i < steps.length; i++) {
    if (i < currentStep) steps[i].fn(1);
    else if (i === currentStep) steps[i].fn(stepT(steps[i]));
  }

  updateUI();

  if (progress < 100) {
    requestAnimationFrame(animate);
  } else {
    (function loop() { buildFinal(1); requestAnimationFrame(loop); })();
  }
}

setTimeout(() => animate(), 400);
</script>
</body>
</html>
