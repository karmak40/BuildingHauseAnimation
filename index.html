<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading — House Construction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0f0f1a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .container {
    position: relative;
    width: 600px;
    height: 500px;
  }

  svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 30px rgba(100, 180, 255, 0.08));
  }

  .progress-wrapper {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    text-align: center;
  }

  .progress-bar-bg {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6c63ff, #48c6ef);
    border-radius: 4px;
    transition: width 0.3s ease;
    box-shadow: 0 0 12px rgba(108, 99, 255, 0.5);
  }

  .progress-text {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .progress-percent {
    color: #fff;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .status-text {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* Stars background */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; }
    50% { opacity: var(--max-o); }
  }

  .container { z-index: 1; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <svg viewBox="0 0 600 500" id="houseSvg">
    <defs>
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:0"/>
        <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      </linearGradient>
      <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#e8e0d4"/>
        <stop offset="100%" style="stop-color:#d4c9b8"/>
      </linearGradient>
      <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#4a5568"/>
        <stop offset="100%" style="stop-color:#2d3748"/>
      </linearGradient>
      <linearGradient id="chimneyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#c53030"/>
        <stop offset="100%" style="stop-color:#9b2c2c"/>
      </linearGradient>
      <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#90cdf4"/>
        <stop offset="100%" style="stop-color:#63b3ed"/>
      </linearGradient>
      <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#2d5a27"/>
        <stop offset="100%" style="stop-color:#1a3a17"/>
      </linearGradient>
      <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#5a3e28"/>
        <stop offset="100%" style="stop-color:#3e2b1b"/>
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="softGlow">
        <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <clipPath id="wallClip">
        <rect x="180" y="220" width="240" height="150" />
      </clipPath>
    </defs>

    <!-- Ground -->
    <rect id="ground" x="0" y="370" width="600" height="130" fill="url(#groundGrad)" opacity="0"/>

    <!-- Foundation line -->
    <rect id="foundation" x="165" y="365" width="270" height="12" rx="2" fill="#4a5568" opacity="0"/>

    <!-- Walls -->
    <g id="walls" opacity="0">
      <rect x="180" y="220" width="240" height="150" fill="url(#wallGrad)" rx="2"/>
      <!-- Wall texture lines -->
      <line x1="180" y1="245" x2="420" y2="245" stroke="#c9bfae" stroke-width="0.5" opacity="0.5"/>
      <line x1="180" y1="270" x2="420" y2="270" stroke="#c9bfae" stroke-width="0.5" opacity="0.5"/>
      <line x1="180" y1="295" x2="420" y2="295" stroke="#c9bfae" stroke-width="0.5" opacity="0.5"/>
      <line x1="180" y1="320" x2="420" y2="320" stroke="#c9bfae" stroke-width="0.5" opacity="0.5"/>
      <line x1="180" y1="345" x2="420" y2="345" stroke="#c9bfae" stroke-width="0.5" opacity="0.5"/>
    </g>

    <!-- Roof -->
    <g id="roof" opacity="0">
      <polygon points="150,225 300,110 450,225" fill="url(#roofGrad)"/>
      <polygon points="160,225 300,118 440,225" fill="none" stroke="#5a6577" stroke-width="1"/>
      <!-- Roof shingles -->
      <line x1="175" y1="210" x2="425" y2="210" stroke="#3d4a5c" stroke-width="0.8" opacity="0.6"/>
      <line x1="195" y1="190" x2="405" y2="190" stroke="#3d4a5c" stroke-width="0.8" opacity="0.6"/>
      <line x1="215" y1="170" x2="385" y2="170" stroke="#3d4a5c" stroke-width="0.8" opacity="0.6"/>
      <line x1="240" y1="150" x2="360" y2="150" stroke="#3d4a5c" stroke-width="0.8" opacity="0.6"/>
      <line x1="265" y1="130" x2="335" y2="130" stroke="#3d4a5c" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Chimney -->
    <g id="chimney" opacity="0">
      <rect x="370" y="130" width="30" height="60" fill="url(#chimneyGrad)" rx="2"/>
      <rect x="366" y="126" width="38" height="10" fill="#9b2c2c" rx="2"/>
    </g>

    <!-- Smoke particles -->
    <g id="smoke" opacity="0"></g>

    <!-- Windows -->
    <g id="windows" opacity="0">
      <!-- Left window -->
      <rect x="205" y="250" width="60" height="65" rx="4" fill="url(#windowGrad)" filter="url(#softGlow)"/>
      <rect x="205" y="250" width="60" height="65" rx="4" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <line x1="235" y1="250" x2="235" y2="315" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
      <line x1="205" y1="282" x2="265" y2="282" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
      <!-- Window glow -->
      <rect x="205" y="250" width="60" height="65" rx="4" fill="#90cdf4" opacity="0.15" filter="url(#softGlow)"/>

      <!-- Right window -->
      <rect x="335" y="250" width="60" height="65" rx="4" fill="url(#windowGrad)" filter="url(#softGlow)"/>
      <rect x="335" y="250" width="60" height="65" rx="4" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <line x1="365" y1="250" x2="365" y2="315" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
      <line x1="335" y1="282" x2="395" y2="282" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
      <rect x="335" y="250" width="60" height="65" rx="4" fill="#90cdf4" opacity="0.15" filter="url(#softGlow)"/>
    </g>

    <!-- Door -->
    <g id="door" opacity="0">
      <rect x="270" y="295" width="55" height="75" rx="4" fill="url(#doorGrad)"/>
      <rect x="270" y="295" width="55" height="75" rx="4" fill="none" stroke="#6b4f35" stroke-width="1.5"/>
      <circle cx="315" cy="335" r="4" fill="#d4a853" filter="url(#glow)"/>
      <!-- Door arch -->
      <path d="M270,295 Q297,280 325,295" fill="none" stroke="#6b4f35" stroke-width="1.5"/>
    </g>

    <!-- Path -->
    <g id="path" opacity="0">
      <polygon points="285,370 270,420 330,420 310,370" fill="#c4b8a8" opacity="0.6"/>
      <polygon points="285,370 270,420 330,420 310,370" fill="none" stroke="#a89888" stroke-width="0.5"/>
    </g>

    <!-- Trees -->
    <g id="trees" opacity="0">
      <!-- Left tree -->
      <rect x="100" y="320" width="8" height="50" fill="#5a3e28" rx="2"/>
      <circle cx="104" cy="305" r="28" fill="#2d6a27"/>
      <circle cx="104" cy="305" r="28" fill="none" stroke="#3d8a37" stroke-width="0.5"/>
      <circle cx="95" cy="295" r="18" fill="#3d7a37" opacity="0.7"/>

      <!-- Right tree -->
      <rect x="490" y="330" width="8" height="40" fill="#5a3e28" rx="2"/>
      <circle cx="494" cy="318" r="24" fill="#2d6a27"/>
      <circle cx="494" cy="318" r="24" fill="none" stroke="#3d8a37" stroke-width="0.5"/>
      <circle cx="500" cy="310" r="16" fill="#3d7a37" opacity="0.7"/>
    </g>

    <!-- Bushes -->
    <g id="bushes" opacity="0">
      <circle cx="185" cy="360" r="14" fill="#3d7a37"/>
      <circle cx="200" cy="363" r="10" fill="#2d6a27"/>
      <circle cx="415" cy="360" r="14" fill="#3d7a37"/>
      <circle cx="400" cy="363" r="10" fill="#2d6a27"/>
    </g>

    <!-- Light rays from windows -->
    <g id="lightRays" opacity="0">
      <polygon points="205,315 170,380 265,380 265,315" fill="#90cdf4" opacity="0.06"/>
      <polygon points="335,315 300,380 395,380 395,315" fill="#90cdf4" opacity="0.06"/>
    </g>

    <!-- Construction crane (disappears at the end) -->
    <g id="crane" opacity="0">
      <rect x="460" y="100" width="6" height="270" fill="#e6a817"/>
      <rect x="440" y="96" width="80" height="8" fill="#e6a817" rx="2"/>
      <line x1="463" y1="104" x2="440" y2="200" stroke="#e6a817" stroke-width="1"/>
      <rect x="432" y="200" width="16" height="12" fill="#c9900a" rx="1"/>
      <line x1="440" y1="212" x2="440" y2="240" stroke="#c9900a" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>
  </svg>

  <div class="progress-wrapper">
    <div class="progress-percent" id="percentText">0%</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressLabel">Загрузка</div>
    <div class="status-text" id="statusText">Подготовка фундамента</div>
  </div>
</div>

<script>
// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
  star.style.setProperty('--max-o', (0.3 + Math.random() * 0.7));
  star.style.animationDelay = Math.random() * 4 + 's';
  starsEl.appendChild(star);
}

// Animation engine
const $ = id => document.getElementById(id);
const els = {
  ground: $('ground'),
  foundation: $('foundation'),
  walls: $('walls'),
  roof: $('roof'),
  chimney: $('chimney'),
  smoke: $('smoke'),
  windows: $('windows'),
  door: $('door'),
  path: $('path'),
  trees: $('trees'),
  bushes: $('bushes'),
  lightRays: $('lightRays'),
  crane: $('crane'),
  progressFill: $('progressFill'),
  percentText: $('percentText'),
  progressLabel: $('progressLabel'),
  statusText: $('statusText'),
};

const svg = $('houseSvg');
const NS = 'http://www.w3.org/2000/svg';

let progress = 0;
let currentStep = 0;

const steps = [
  { from: 0,  to: 10,  label: 'Фундамент',       status: 'Подготовка основания',          action: buildFoundation },
  { from: 10, to: 30,  label: 'Стены',             status: 'Возведение стен',              action: buildWalls },
  { from: 30, to: 50,  label: 'Крыша',             status: 'Монтаж кровли',                action: buildRoof },
  { from: 50, to: 62,  label: 'Окна',              status: 'Установка окон',               action: buildWindows },
  { from: 62, to: 72,  label: 'Дверь',             status: 'Установка двери',              action: buildDoor },
  { from: 72, to: 82,  label: 'Благоустройство',   status: 'Озеленение территории',        action: buildLandscaping },
  { from: 82, to: 95,  label: 'Отделка',           status: 'Финальная отделка',            action: buildFinishing },
  { from: 95, to: 100, label: 'Завершение',        status: 'Дом готов!',                   action: buildFinal },
];

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function stepProgress(step, progress) {
  return clamp01((progress - step.from) / (step.to - step.from));
}

function buildFoundation(t) {
  t = easeOutCubic(t);
  els.foundation.setAttribute('opacity', t);
  els.ground.setAttribute('opacity', t * 0.8);

  // Show crane at start
  els.crane.setAttribute('opacity', t * 0.7);
}

function buildWalls(t) {
  t = easeOutCubic(t);
  els.walls.setAttribute('opacity', t);

  // Crane fades a bit
  els.crane.setAttribute('opacity', lerp(0.7, 0.3, t));

  // Draw walls with clip animation
  const clip = els.walls.querySelector('rect');
  if (clip) {
    clip.setAttribute('height', 150 * t);
    clip.setAttribute('y', 220 + 150 * (1 - t));
  }
}

function buildRoof(t) {
  t = easeOutCubic(t);
  els.roof.setAttribute('opacity', t);
  els.chimney.setAttribute('opacity', t);

  // Crane lowers
  els.crane.setAttribute('opacity', lerp(0.3, 0, t));
}

function buildWindows(t) {
  t = easeOutCubic(t);
  els.windows.setAttribute('opacity', t);
}

function buildDoor(t) {
  t = easeOutCubic(t);
  els.door.setAttribute('opacity', t);
}

function buildLandscaping(t) {
  t = easeOutCubic(t);
  els.trees.setAttribute('opacity', t);
  els.bushes.setAttribute('opacity', t);
  els.path.setAttribute('opacity', t);
}

function buildFinishing(t) {
  t = easeOutCubic(t);
  els.lightRays.setAttribute('opacity', t);

  // Smoke
  els.smoke.setAttribute('opacity', t);
  createSmoke(t);
}

function buildFinal(t) {
  t = easeOutCubic(t);
  // Crane fully gone
  els.crane.setAttribute('opacity', 0);
  // Everything at full opacity
  els.smoke.setAttribute('opacity', 1);
  els.lightRays.setAttribute('opacity', 1);

  // Window glow pulse
  const winGlow = els.windows.querySelectorAll('rect[opacity="0.15"]');
  const pulse = 0.15 + 0.05 * Math.sin(Date.now() / 500);
  winGlow.forEach(r => r.setAttribute('opacity', pulse));
}

let smokeParticles = [];
function createSmoke(t) {
  if (Math.random() < 0.08 && t > 0.3) {
    const circle = document.createElementNS(NS, 'circle');
    const cx = 385 + Math.random() * 6;
    const cy = 120;
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', cy);
    circle.setAttribute('r', 3 + Math.random() * 4);
    circle.setAttribute('fill', 'rgba(200,200,210,0.3)');
    els.smoke.appendChild(circle);
    smokeParticles.push({ el: circle, x: cx, y: cy, age: 0, maxAge: 60 + Math.random() * 40 });
  }

  smokeParticles = smokeParticles.filter(p => {
    p.age++;
    const life = p.age / p.maxAge;
    const newY = p.y - life * 60;
    const newX = p.x + Math.sin(p.age * 0.1) * 8;
    p.el.setAttribute('cy', newY);
    p.el.setAttribute('cx', newX);
    p.el.setAttribute('opacity', (1 - life) * 0.4);
    p.el.setAttribute('r', parseFloat(p.el.getAttribute('r')) + 0.05);
    if (p.age >= p.maxAge) {
      p.el.remove();
      return false;
    }
    return true;
  });
}

function updateUI() {
  const pct = Math.round(progress);
  els.percentText.textContent = pct + '%';
  els.progressFill.style.width = pct + '%';

  const step = steps[currentStep] || steps[steps.length - 1];
  els.progressLabel.textContent = step.label;
  els.statusText.textContent = step.status;
}

function animate() {
  if (progress < 100) {
    progress += 0.15 + (Math.random() * 0.1);
    if (progress > 100) progress = 100;
  }

  // Determine current step
  for (let i = steps.length - 1; i >= 0; i--) {
    if (progress >= steps[i].from) {
      currentStep = i;
      break;
    }
  }

  // Run all steps up to current, and partially run current
  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    if (i < currentStep) {
      step.action(1);
    } else if (i === currentStep) {
      const t = stepProgress(step, progress);
      step.action(t);
    }
  }

  updateUI();

  if (progress < 100) {
    requestAnimationFrame(animate);
  } else {
    // Loop subtle glow
    function finalLoop() {
      buildFinal(1);
      requestAnimationFrame(finalLoop);
    }
    finalLoop();
  }
}

// Start
setTimeout(() => {
  animate();
}, 500);
</script>
</body>
</html>
